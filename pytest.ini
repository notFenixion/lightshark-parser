[tool:pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests for individual classes
    integration: Integration tests with real data
    slow: Tests that take longer to run
    master_show: Tests that require master show data

[tool:pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --cov=lightshark_parser
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

filterwarnings = 
    ignore::UserWarning
    ignore::DeprecationWarning
